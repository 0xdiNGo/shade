{{- /*
shade-secrets Secret — mesh PSK and optional SASL PLAIN password.
These are surfaced as environment variables via envFrom in the StatefulSet
so they never appear in the rendered shade.toml ConfigMap.

Keys:
  SHADE_MESH_PSK       — required; 32+ bytes base64. Used by all peers to
                         verify HMAC-SHA256 cookies.
  SHADE_SASL__PASSWORD — optional; only needed for SASL PLAIN auth toward
                         the IRC server. Leave empty for SASL EXTERNAL.

Create or update this Secret before deploying:

  kubectl create secret generic <release>-shade-secrets \
    --from-literal=SHADE_MESH_PSK="$(head -c 48 /dev/urandom | base64)" \
    --from-literal=SHADE_SASL__PASSWORD="<irc-sasl-password>" \
    --dry-run=client -o yaml | kubectl apply -f -

The placeholder values below are overwritten by that command; they are not
meaningful defaults and will cause the daemon to fail authentication.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shade.secretsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Replace with a real PSK before any node forms a mesh.
  SHADE_MESH_PSK: ""
  # Only required for SASL PLAIN; leave empty for SASL EXTERNAL.
  SHADE_SASL__PASSWORD: ""
