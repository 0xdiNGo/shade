{{- /*
shade-pki Secret — holds the mTLS material for the mesh and admin listeners.
This Secret is normally created by the bootstrap Job (see job-bootstrap.yaml).
You can also manage it externally (External Secrets Operator, Vault Agent
injector, etc.) and set bootstrapJob.enabled: false.

Keys expected by the daemon:
  botnet-ca.pem  — CA bundle that signs both node certs and admin client certs
  node.pem       — this node's TLS certificate (SAN = node_id)
  node.key       — this node's private key
  admin-ca.pem   — CA that signed operator client certs; today Shade reuses
                   botnet-ca.pem, so this key is optional and defaults to the
                   same bundle.

The Secret is pre-populated with empty placeholders so helm install doesn't
fail if the bootstrap Job hasn't run yet. The Job patches the Secret with
real PEM data once it completes.

If the Secret already exists in the cluster (e.g., from a previous install or
an external PKI operator) the bootstrap Job will skip cert generation.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shade.pkiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Populated by the bootstrap Job on first install; kept across upgrades.
  # To rotate certs: update this Secret (or re-run the bootstrap Job) and
  # perform a rolling restart of the StatefulSet.
  botnet-ca.pem: ""
  node.pem: ""
  node.key: ""
  admin-ca.pem: ""
