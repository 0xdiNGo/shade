{{- /*
Headless Service — gives each pod a stable DNS name:
  <release>-shade-<n>.<release>-shade.<namespace>.svc.cluster.local
Required for StatefulSet peer discovery; the mesh.peers list in the ConfigMap
uses this naming scheme.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shade.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
spec:
  clusterIP: None  # headless — DNS resolves to pod IPs directly
  selector:
    {{- include "shade.selectorLabels" . | nindent 4 }}
  ports:
    - name: mesh
      port: {{ .Values.mesh.listenPort }}
      targetPort: mesh
      protocol: TCP
{{- /*
ClusterIP Service for the mTLS admin listener. Exposed within the cluster;
reach via Ingress or port-forward for external access.
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shade.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.admin.type }}
  selector:
    {{- include "shade.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
{{- /*
ClusterIP Service for the plain-HTTP metrics and probe listener.
Prometheus scrapes this; liveness/readiness probes also use it.
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shade.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.metrics.type }}
  selector:
    {{- include "shade.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
