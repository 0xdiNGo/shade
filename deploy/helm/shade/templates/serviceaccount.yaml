{{- /*
ServiceAccount for the bootstrap Job. The Job needs to create/patch
the shade-pki Secret in the release namespace.
*/ -}}
{{- if .Values.bootstrapJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shade.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shade.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shade.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shade.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shade.fullname" . }}-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "shade.fullname" . }}-bootstrap
{{- end }}
