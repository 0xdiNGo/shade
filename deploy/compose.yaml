# Local-dev compose for a single Shade node.
#
# Multi-node mesh + ergo IRC server land in M4. For now this just gets you
# `docker compose up` with the daemon running, exposing /healthz, /readyz,
# and /metrics on the host.
#
#   cd deploy
#   docker compose up --build

services:
  shade:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shade:dev
    container_name: shade-dev
    ports:
      - "127.0.0.1:8443:8443"  # admin API
      - "127.0.0.1:9090:9090"  # metrics
      - "127.0.0.1:7331:7331"  # mesh listener
    volumes:
      - shade-data:/var/lib/shade
      - ./shade.example.toml:/etc/shade/shade.toml:ro
    restart: unless-stopped

volumes:
  shade-data:
