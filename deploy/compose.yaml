# Local-dev compose.
#
# Two services:
#   - ergo:  IRCv3 server (https://ergo.chat) listening on 6667 plaintext.
#   - shade: the daemon, dialing ergo, reaching RPL_WELCOME, joining
#            #shade-test, and answering `!ping` with `pong`.
#
# Multi-node mesh + mTLS land in M4. Until then this is single-node only.
#
#   cd deploy
#   docker compose up --build
#
#   # In another terminal:
#   curl http://127.0.0.1:8443/readyz   # expect irc_connected=true
#   # any IRC client → 127.0.0.1:6667, /JOIN #shade-test, /MSG #shade-test !ping

services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: shade-ergo
    ports:
      - "127.0.0.1:6667:6667"
    volumes:
      - ./ergo/ircd.yaml:/ircd/ircd.yaml:ro
      - ergo-data:/ircd
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo > /dev/tcp/127.0.0.1/6667"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shade:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shade:dev
    container_name: shade-dev
    depends_on:
      ergo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"  # admin API
      - "127.0.0.1:9090:9090"  # metrics
      - "127.0.0.1:7331:7331"  # mesh listener
    volumes:
      - shade-data:/var/lib/shade
      - ./shade.example.toml:/etc/shade/shade.toml:ro
    restart: unless-stopped

volumes:
  ergo-data:
  shade-data:
