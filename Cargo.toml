[workspace]
resolver = "2"
members = [
    "crates/shade-proto",
    "crates/shade-core",
    "crates/shade-ircd",
    "crates/shade-mesh",
    "crates/shade-api",
    "crates/shade-store",
    "crates/shade-bin",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/0xdiNGo/shade"
homepage = "https://github.com/0xdiNGo/shade"
publish = false

[workspace.dependencies]
# Core async + TLS
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"

# Serde + framing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
toml = "0.8"

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Errors
anyhow = "1"
thiserror = "2"

# Utilities
ulid = { version = "1", features = ["serde"] }
jiff = { version = "0.1", features = ["serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
