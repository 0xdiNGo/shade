name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: shade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: shade --version inside the image
        run: docker run --rm shade:ci --version
      - name: shade --help inside the image
        run: docker run --rm shade:ci --help

  compose-smoke:
    name: compose smoke (ergo + shade)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up + smoke.sh
        working-directory: deploy
        run: ./smoke.sh
      - name: dump shade logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs shade

  fuzz:
    name: fuzz parser
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz"
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz irc_parser for 5 min
        working-directory: fuzz
        run: cargo +nightly fuzz run irc_parser seed_corpus/irc_parser -- -max_total_time=300
      - name: upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
